# OpenCode in Docker, for the free OpenCode Zen models.
#
# Zen serves its free models only to the OpenCode app, so ARTEX reaches them
# through a real OpenCode server plus the opencode-bridge (OpenAI-compatible).
# Both run on the Compose network only: nothing is published on the host, so no
# firewall prompt and no admin rights are needed.
#
#   .env:  OPENCODE_ZEN_API_KEY=<your Zen key>  (used by OpenCode, never by ARTEX)
#          OPENCODE_SERVER_PASSWORD=<random>   (OpenCode server password)
#          OPENCODE_BRIDGE_TOKEN=<random>      (the API key ARTEX sends to the bridge)
#          COMPOSE_FILE=docker-compose.yml;docker-compose.windows.yml;docker-compose.opencode.yml
#   run:   docker compose up -d --build
#
# ARTEX LLM profile: format "OpenAI (Chat Completions)", base URL
# http://opencode-bridge:8789/v1, API key = OPENCODE_BRIDGE_TOKEN, streaming off.
# See scripts/opencode-bridge/README.md.

x-opencode-image: &opencode-image
  build:
    context: ./scripts/opencode-bridge
  image: artex-opencode:local

services:
  opencode:
    <<: *opencode-image
    # Locked-down `opencode serve` (see scripts/opencode-bridge/opencode-entry.mjs):
    # no project config, plugins, sharing or updates; every permission denied; a
    # tool-less "bridge" agent; no background calls to paid helper models.
    command: ["node", "/bridge/opencode-entry.mjs"]
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Please set OPENCODE_SERVER_PASSWORD in .env}
      # Your OpenCode Zen API key. Empty = use an account login made inside the
      # container with `opencode console login` (needed when the key is a "Legacy"
      # one, which Zen refuses for free models). See scripts/opencode-bridge/README.md.
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    volumes:
      - opencode-data:/home/node/.local/share/opencode
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  opencode-bridge:
    <<: *opencode-image
    command: ["node", "/bridge/bridge.mjs"]
    depends_on:
      - opencode
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_TOKEN: ${OPENCODE_BRIDGE_TOKEN:?Please set OPENCODE_BRIDGE_TOKEN in .env}
      # Upstream OpenCode server. Default: the "opencode" container above. To use the
      # OpenCode desktop app on the host instead (it signs Zen calls with your account),
      # set OPENCODE_BRIDGE_UPSTREAM=http://host.docker.internal:<app port>, its server
      # user/password, and OPENCODE_BRIDGE_AGENT= (empty: the app has no "bridge" agent).
      BRIDGE_AGENT: ${OPENCODE_BRIDGE_AGENT-bridge}
      OPENCODE_URL: ${OPENCODE_BRIDGE_UPSTREAM:-http://opencode:4096}
      OPENCODE_USERNAME: ${OPENCODE_BRIDGE_UPSTREAM_USER:-opencode}
      OPENCODE_PASSWORD: ${OPENCODE_BRIDGE_UPSTREAM_PASSWORD:-${OPENCODE_SERVER_PASSWORD}}
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  artex:
    environment:
      # The model-list check refuses private addresses unless listed here.
      ARTEX_LLM_PRIVATE_ENDPOINTS: opencode-bridge:8789
    depends_on:
      opencode-bridge:
        condition: service_started

volumes:
  opencode-data:
